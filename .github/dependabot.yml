version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
        # Its reviewed runtime-bootstrap pin has a dedicated CI assertion.
        exclude-patterns: ['*/plugin-check-action']
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      test-images:
        patterns: ['*']
        update-types: [minor, patch]
