name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag; omit only for a dry run of the selected branch.
        type: string
        default: ''
      dry_run:
        description: Verify and prepare artifacts without publishing.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Validate release source and publication intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.source.outputs.publish }}
      slug: ${{ steps.source.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require stable tags from main for publication
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DEPLOY_ENABLED: ${{ vars.WORDPRESS_DEPLOY_ENABLED }}
          PLUGIN_SLUG: ${{ vars.WORDPRESS_PLUGIN_SLUG }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Use an existing stable vX.Y.Z tag.'; exit 1; }
            git show-ref --verify "refs/tags/$REQUESTED_TAG"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$REQUESTED_TAG^{commit}")" ]] || { echo '::error::The checkout does not match the requested tag.'; exit 1; }
          elif [[ "$DRY_RUN" != true ]]; then
            echo '::error::Publishing requires an existing release tag.'
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Release source must already be on main.'; exit 1; }
          publish=false
          if [[ "$DRY_RUN" != true && "$DEPLOY_ENABLED" == true ]]; then
            [[ "$PLUGIN_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo '::error::Set the approved WORDPRESS_PLUGIN_SLUG repository variable.'; exit 1; }
            [[ "$REF_TYPE" == tag && "$REF_NAME" == "$REQUESTED_TAG" ]] || { echo '::error::Dispatch publication on the matching tag ref, not on a branch.'; exit 1; }
            publish=true
          fi
          package_slug="${PLUGIN_SLUG:-wordpress-sso}"
          [[ "$package_slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo '::error::Invalid plugin slug.'; exit 1; }
          printf 'sha=%s\ntag=%s\npublish=%s\nslug=%s\n' "$(git rev-parse HEAD)" "$REQUESTED_TAG" "$publish" "$package_slug" >> "$GITHUB_OUTPUT"
          printf '### Release intent\n\nWordPress.org publication enabled for this run: **%s**.\n' "$publish" >> "$GITHUB_STEP_SUMMARY"
      - name: Require matching plugin header, constant, readme and tag
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          tag_args=()
          if [[ -n "$RELEASE_TAG" ]]; then tag_args=(--tag "$RELEASE_TAG"); fi
          node scripts/release.mjs validate "${tag_args[@]}" --github-output "$GITHUB_OUTPUT"

  verify:
    name: Verify exact release commit
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      checkout_ref: ${{ needs.resolve.outputs.sha }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      package_slug: ${{ needs.resolve.outputs.slug }}

  candidate:
    name: Verify the tested release artifact
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist
      - name: Verify checksum and exact distributable source
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          WILL_PUBLISH: ${{ needs.resolve.outputs.publish }}
          PACKAGE_SLUG: ${{ needs.resolve.outputs.slug }}
        run: |
          (cd dist && sha256sum --check "$PACKAGE_SLUG-$VERSION.zip.sha256")
          unzip -q "dist/$PACKAGE_SLUG-$VERSION.zip" -d .test-runtime/candidate
          node scripts/release.mjs verify --output ".test-runtime/candidate/$PACKAGE_SLUG"
          printf '### Verified release candidate\n\nVersion: **%s**. Checksums and packaged files match the tested commit.\n\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$WILL_PUBLISH" != true ]]; then
            printf 'Artifacts are ready for review. No WordPress.org or GitHub release will be published. Directory approval, a clean Plugin Check, repository variables and environment secrets are required for publication.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  directory-review:
    name: Required marketplace review
    if: needs.resolve.outputs.publish == 'true'
    needs: [resolve, verify, candidate]
    uses: ./.github/workflows/wordpress-review.yml
    with:
      checkout_ref: ${{ needs.resolve.outputs.sha }}
      slug: ${{ vars.WORDPRESS_PLUGIN_SLUG }}

  deploy:
    name: Publish to WordPress.org
    if: needs.resolve.outputs.publish == 'true'
    needs: [resolve, verify, candidate, directory-review]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/${{ vars.WORDPRESS_PLUGIN_SLUG }}/
    concurrency:
      group: wordpress-org-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist
      - name: Verify immutable artifact and assigned SVN repository
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PLUGIN_SLUG: ${{ vars.WORDPRESS_PLUGIN_SLUG }}
          WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
          WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
        run: |
          [[ -n "$WPORG_USERNAME" && -n "$WPORG_PASSWORD" ]] || { echo '::error::Configure WPORG_USERNAME and WPORG_PASSWORD in the wordpress-org environment.'; exit 1; }
          (cd dist && sha256sum --check "$PLUGIN_SLUG-$VERSION.zip.sha256")
          unzip -q "dist/$PLUGIN_SLUG-$VERSION.zip" -d .test-runtime/deploy
          node scripts/release.mjs verify --output ".test-runtime/deploy/$PLUGIN_SLUG"
          node scripts/check-wordpress-release.mjs --slug "$PLUGIN_SLUG" --version "$VERSION"
      - name: Publish the exact tested files to SVN trunk and immutable version tag
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.WPORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
          SLUG: ${{ vars.WORDPRESS_PLUGIN_SLUG }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_DIR: .test-runtime/deploy/${{ needs.resolve.outputs.slug }}

  github-release:
    name: Attach the published plugin to its GitHub release
    needs: [resolve, verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist
      - name: Create release with the exact WordPress.org ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --verify-tag --target "$RELEASE_SHA" --generate-notes
