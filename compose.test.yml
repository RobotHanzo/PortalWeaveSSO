name: ${COMPOSE_PROJECT_NAME:-portalweave-sso-test}
services:
  db:
    image: mariadb:13.0
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-test-only
      MARIADB_ROOT_PASSWORD: root-test-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      retries: 40
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: ${PORTALWEAVE_SSO_WORDPRESS_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8098:80
      - 127.0.0.1:8448:443
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/var/www/html/wp-load.php') ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/portalweave-sso
  cli:
    image: ${PORTALWEAVE_SSO_CLI_IMAGE:-wordpress:cli-php8.3}
    user: '33:33'
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/portalweave-sso
volumes:
  db:
  wordpress:
